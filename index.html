<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Front Seat</title>
    <!-- Boostrap link  -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Stylesheet link -->
    <link rel="stylesheet" href="stylesheet.css" />
    <!-- font awesome link -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  </head>
  <body>
    <!-- <h1>Front Seat</h1> -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <!-- Header -->
    <div class="container">
      <header
        class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom"
      >
       <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
  <i class="fa-solid fa-taxi fs-4 me-2" style="color: rgb(255, 212, 59);"></i>
  <h1 class="fs-4 mb-0">Front Seat</h1>
</a>
        <ul class="nav nav-pills">
          <li class="nav-item">
            <a href="#pricing" class="btn btn-primary" id="pricingBtn">Pricing</a>
          </li>
        </ul>
      </header>
    </div>
    <!-- Pricing  -->
     <main>
     <div class="pricing-header p-3 pb-md-4 mx-auto text-center"> 
      <h2 id="pricing" class="display-4 fw-normal text-body-emphasis">Pricing</h2> 
      <p class="fs-5 text-body-secondary">The taxi fare from Vosloorus to Rosebank is R35.00, per person.</p> 
    </div> </header> 
    <main> 
     <div class="row row-cols-1 row-cols-md-1 mb-3 text-center">
       <div class="col"> <div class="card mb-4 rounded-3 shadow-sm" id="taxi-fare-box">
         <div class="card-header py-3"> <h4 class="my-0 fw-normal">Taxi Fare</h4> 
        </div> 
        <div class="card-body"> 
          <h1 class="card-title pricing-card-title">R35.00<small class="text-body-secondary fw-light">/person</small></h1>
    
             </div> </div> </div>
            </main>

          <!-- Column for each row and numbers of passengers -->
           <div class="money-table">
          <div class="container text-center">
<div class="row row-cols-1 row-cols-sm-2 row-cols-md-4">
    <div class="col">Row</div>
    <div class="col">Number of Passengers</div>
    <div class="col">Total paid</div>
    <div class="col">Change</div>
  </div>
</div>
<!-- ROW 1 - 1 passenger -->
<div class="container text-center" id="row-1">
  <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4">
    <div class="col">1</div>
    <div class="col passengers">1</div>
    <div class="col"><input type="number" class="paid" placeholder="Type amount"></div>
    <div class="col change"></div>
  </div>
</div>

<!-- ROW 2 - 4 passengers -->
<div class="container text-center" id="row-2">
  <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4">
    <div class="col">2</div>
    <div class="col passengers">4</div>
    <div class="col"><input type="number" class="paid" placeholder="Type amount"></div>
    <div class="col change"></div>
  </div>
</div>
<!-- ROW 3- 3 passenger -->
<div class="container text-center" id="row-3">
  <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4">
    <div class="col">3</div>
    <div class="col passengers">3</div>
    <div class="col"><input type="number" class="paid" placeholder="Type amount"></div>
    <div class="col change"></div>
  </div>
</div>

<!-- ROW 4 - 3 passengers -->
<div class="container text-center" id="row-4">
  <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4">
    <div class="col">4</div>
    <div class="col passengers">3</div>
    <div class="col"><input type="number" class="paid" placeholder="Type amount"></div>
    <div class="col change"></div>
  </div>
</div>
<!-- ROW 5 - 4 passengers -->
<div class="container text-center" id="row-5">
  <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4">
    <div class="col">5</div>
    <div class="col passengers">4</div>
    <div class="col"><input type="number" class="paid" placeholder="Type amount"></div>
    <div class="col change"></div>
  </div>
</div>

           </div>
<!-- Footer -->
 <div class="b-example-divider"></div> 
 <div class="container"> 
  <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"> <div class="col-md-4 d-flex align-items-center"> <a href="/" class="mb-3 me-2 mb-md-0 text-body-secondary text-decoration-none lh-1" aria-label="Bootstrap"> 
    <svg class="bi" width="30" height="24" aria-hidden="true">
      <use xlink:href="#bootstrap"></use></svg> </a>
       <span class="mb-3 mb-md-0 text-body-secondary">&copy; 2025 Company, Inc</span> </div>

            <svg class="bi" width="24" height="24" aria-hidden="true"><use xlink:href="#instagram">

            </use></svg></a></li>
             <li class="ms-3"><a class="text-body-secondary" href="#" aria-label="Facebook">
              <svg class="bi" width="24" height="24"><use xlink:href="#facebook">

              </use></svg></a></li> </ul> </footer> </div> 
 <div class="b-example-divider"></div>

 <script src="script.js"></script>
</body>
</html>
